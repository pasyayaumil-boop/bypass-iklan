
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RED STORM</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #08080d;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
main {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 100px 22px 20px;
}
h1 {
  color: #ff2525;
  font-size: 42px;
  text-shadow: 0 0 20px red;
}
p { color: #ccc; }
button {
  background: #c90020;
  color: white;
  border: 1px solid #ff5555;
  padding: 16px 28px;
  border-radius: 12px;
  font-size: 17px;
  margin-top: 25px;
}
</style>
</head>
<body>
<canvas id="storm"></canvas>
<main>
<h1>RED STORM</h1>
<p>⚡ Welcome to the storm ⚡</p>
<p>Hujan merah telah dimulai.</p>
<button onclick="alert('RED STORM siap!')">
MULAI
</button>
</main>
<script>
const c = document.getElementById("storm");
const ctx = c.getContext("2d");
let drops = [];
function resize() {
 c.width = innerWidth;
 c.height = innerHeight;
}
resize();
window.onresize = resize;
for(let i=0;i<120;i++){
 drops.push({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  s:3+Math.random()*7
 });
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle="#ff2525";
 ctx.lineWidth=1;
 drops.forEach(d=>{
  ctx.beginPath();
  ctx.moveTo(d.x,d.y);
  ctx.lineTo(d.x-2,d.y+d.s*3);
  ctx.stroke();
  d.y+=d.s;
  if(d.y>c.height){
   d.y=0;
   d.x=Math.random()*c.width;
  }
 });
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
